# Local dependencies. Run Postgres yourself rather than against a serverless provider:
# LISTEN/NOTIFY needs a long-lived session, and you want CREATE SCHEMA to be instant.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: supavolt_admin
      POSTGRES_PASSWORD: supavolt
      POSTGRES_DB: supavolt
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # S3-compatible storage for local development. In production use S3 or Cloudflare R2.
  # RustFS replaces MinIO, whose images are no longer published; it keeps MinIO's ports, access
  # keys and console. The dev profile creates the bucket on first start.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: supavolt
      RUSTFS_SECRET_KEY: supavolt123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - storagedata:/data

  # The API in a JDK container, for when you would rather not install Java 17 and Maven:
  #   docker compose --profile api up -d
  # Secrets come from the same file the API reads natively (see README), mounted read-only.
  api:
    profiles: ["api"]
    image: eclipse-temurin:17-jdk
    working_dir: /src
    command: sh -c "./mvnw -B -q -DskipTests install && java -jar api/target/supavolt-api-0.1.0-SNAPSHOT.jar"
    depends_on: [postgres, storage]
    ports: ["5000:5000"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supavolt
      SUPAVOLT_SECRETS_FILE: /run/secrets/supavolt.yml
      # Presigned URLs embed this host, so it must resolve from both the container and your browser.
      SUPAVOLT_STORAGE_SERVICEURL: http://host.docker.internal:9000
      # Integration tests start their own Postgres through the host's Docker daemon.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - .:/src
      # Build output stays in volumes, so the container never leaves root-owned files on the host.
      - api_target:/src/api/target
      - contracts_target:/src/contracts/target
      - maven:/root/.m2
      - ${SUPAVOLT_SECRETS_FILE:-~/.config/supavolt/secrets.yml}:/run/secrets/supavolt.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  storagedata:
  api_target:
  contracts_target:
  maven:
